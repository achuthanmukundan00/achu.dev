<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Gemma 8K aggregate decode throughput</title>
  <desc id="chart-description">At 4,812 prior tokens, Gemma AutoRound produced 45.43 aggregate generation tokens per second at concurrency one, 73.46 at concurrency two, and 109.56 at concurrency four. BF16 produced 20.08 at concurrency one and 64.85 at concurrency four.</desc>
