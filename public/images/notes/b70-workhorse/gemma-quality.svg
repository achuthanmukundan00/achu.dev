<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Gemma BF16 and AutoRound quality checks</title>
  <desc id="chart-description">AutoRound's conditional assistant-target perplexity ratio was 1.108 on WikiText-2 and 0.930 on HumanEval canonical code. Forward KL was 0.119 nats per token with a 95 percent interval from 0.100 to 0.140. Reverse KL was 0.119 with an interval from 0.090 to 0.149.</desc>
