<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="chart-title chart-description">
  <title id="chart-title">Memory reported by vLLM at startup</title>
  <desc id="chart-description">vLLM reported model load and available KV memory for five tested configurations. Gemma 4 12B AutoRound loaded in 7.63 GiB with 19.13 GiB available for KV, while Gemma BF16 loaded in 22.73 GiB with 7.58 GiB available at a higher GPU memory utilization setting.</desc>
